[pytest]
pythonpath = .
testpaths = tests
addopts = -ra
markers =
    smoke: ruta corta de validacion end-to-end antes de release local
    unit: pruebas rapidas de servicios, contratos y reglas
    api: pruebas de API FastAPI sobre fixture aislado
    slow: escenarios mas costosos que no entran en la rutina rapida
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.
